[project]
name = "advisor-pulse"
version = "0.1.0"
description = "Weekly-batch BI pipeline for a fictional bank's advisor activity. All data is synthetic."
readme = "README.md"
license = "MIT"
authors = [{ name = "Charlie G" }]
requires-python = ">=3.12,<3.13"
# Runtime dependencies for every planned module, declared once so parallel issues
# do not each edit this shared file. Add new ones only with a reason in the PR.
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "faker>=30.0",
    "tenacity>=9.0",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "boto3>=1.35",
    "anthropic>=0.40",
    "gspread>=6.1",
    "xxhash>=3.5",
]

[project.scripts]
pulse = "pulse.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "moto[s3]>=5.0",
    "types-pyyaml",
    "boto3-stubs[s3]",
    "pyarrow-stubs>=20.0.0.20260819",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typographic characters (–, ×, →) are intentional in copy and docs.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Backlog data file: long prose strings by design.
"scripts/backlog.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
markers = [
    "unit: fast, no I/O beyond tmp_path (default)",
    "integration: DuckDB on fixtures",
    "slow: multi-week generation or full pipeline",
    "live: calls external APIs; never runs in CI by default",
]
