name: Deploy to Cloudflare Pages
description: >-
  Deploy a successful build from main, or redeploy the last successful site with
  the failed run log. Skips with a step-summary note when credentials are absent.

inputs:
  run-outcome:
    description: Outcome of the pipeline step (success, failure, ...)
    required: true
  build-outcome:
    description: Outcome of the site build step
    required: true
  cloudflare-api-token:
    description: CLOUDFLARE_API_TOKEN secret
    required: false
    default: ''
  cloudflare-account-id:
    description: CLOUDFLARE_ACCOUNT_ID secret
    required: false
    default: ''
  github-token:
    description: Token that can read this repository's Actions artifacts
    required: true

runs:
  using: composite
  steps:
    - name: Check Cloudflare deployment credentials
      id: cloudflare
      if: always()
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        GIT_REF: ${{ github.ref }}
      run: |
        if [[ "$GIT_REF" != refs/heads/main ]]; then
          echo 'available=false' >> "$GITHUB_OUTPUT"
          echo 'Cloudflare Pages deploy skipped: only runs from main deploy.' >> "$GITHUB_STEP_SUMMARY"
        elif [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
          echo 'available=true' >> "$GITHUB_OUTPUT"
        else
          echo 'available=false' >> "$GITHUB_OUTPUT"
          echo 'Cloudflare Pages deploy skipped: credentials are not configured.' >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Deploy successful site
      id: deploy_pages
      if: steps.cloudflare.outputs.available == 'true' && inputs.run-outcome == 'success' && inputs.build-outcome == 'success'
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: |
        npx --yes wrangler@4.151.1 pages deploy web/dist --project-name advisor-pulse | tee "$RUNNER_TEMP/pages-deploy.log"
        url=$(grep -oE 'https://[a-z0-9-]+\.advisor-pulse\.pages\.dev' "$RUNNER_TEMP/pages-deploy.log" | tail -n 1 || true)
        echo "url=$url" >> "$GITHUB_OUTPUT"

    # The recap video is optional, but a deploy that carries it must serve it as video: a file
    # missing from the upload falls through to index.html (/* /index.html 200) as text/html.
    - name: Check recap video on the deployment
      if: steps.deploy_pages.outcome == 'success'
      shell: bash
      env:
        DEPLOY_URL: ${{ steps.deploy_pages.outputs.url }}
      run: bash "$GITHUB_ACTION_PATH/check_recap.sh" web/dist "$DEPLOY_URL"

    - name: Save successful Pages artifact
      if: steps.deploy_pages.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: pages-deploy-${{ github.run_id }}
        path: web/dist/
        if-no-files-found: error
        retention-days: 30

    - name: Restore prior Pages deployment on failed run
      id: recovery
      if: always() && steps.cloudflare.outputs.available == 'true' && inputs.run-outcome == 'failure'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        if [[ ! -s data/exports/run_log.json ]]; then
          echo 'Pages recovery skipped: no failed run log was written.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if ! python -c '
        import json, sys
        from pathlib import Path
        runs = json.loads(Path("data/exports/run_log.json").read_text()).get("runs") or []
        sys.exit(0 if runs and runs[0].get("status") == "FAILED" else 1)
        '; then
          echo 'Pages recovery skipped: the run log does not record a failed run.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate \
          --jq '.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main" and (.name | startswith("pages-deploy-"))) | [.created_at, .name] | @tsv' \
          | sort -r | awk 'NR == 1 {print $2}')
        if [[ ! "$artifact" =~ ^pages-deploy-[0-9]+$ ]]; then
          echo 'Pages recovery skipped: no previous successful deployment artifact is available.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        previous="$RUNNER_TEMP/previous-pages"
        mkdir -p "$previous"
        if ! gh run download "${artifact#pages-deploy-}" -n "$artifact" -D "$previous"; then
          echo 'Pages recovery skipped: the previous deployment artifact could not be downloaded.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if [[ ! -f "$previous/index.html" || ! -f "$previous/data/manifest.json" ]]; then
          echo 'Pages recovery skipped: the previous deployment artifact is incomplete.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        cp data/exports/run_log.json "$previous/data/run_log.json"
        if [[ -e web/dist ]]; then mv web/dist "$RUNNER_TEMP/failed-site-build"; fi
        mv "$previous" web/dist
        echo 'ready=true' >> "$GITHUB_OUTPUT"

    - name: Redeploy prior site with failed run log
      if: always() && steps.cloudflare.outputs.available == 'true' && steps.recovery.outputs.ready == 'true'
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: |
        npx --yes wrangler@4.151.1 pages deploy web/dist --project-name advisor-pulse
        echo 'Pages redeployed the previous report with the latest failed run log.' >> "$GITHUB_STEP_SUMMARY"
