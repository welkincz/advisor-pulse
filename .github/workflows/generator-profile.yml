# Performance branches must preserve generator bytes; functional changes use other lanes.
# Push CI measures Ubuntu before the author opens a ready PR. No manual trigger or secrets.
name: Generator performance

on:
  push:
    branches: ['perf/**']
    paths:
      - 'src/pulse/generate/**'
      - 'scripts/profile_generation.py'
      - '.github/workflows/generator-profile.yml'

permissions:
  contents: read

concurrency:
  group: generator-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Record runner profile
        run: uv run python scripts/runner_profile.py --out runner-profile.json
      - name: Compare identical default-scale weekly outputs
        run: uv run python scripts/profile_generation.py --out generator-profile.json
      - name: Publish profile table
        if: always()
        run: test ! -f generator-profile.md || cat generator-profile.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generator-profile
          path: |
            generator-profile.json
            generator-profile.md
            runner-profile.json
