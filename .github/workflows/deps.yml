# Re-label dependents: status:blocked → status:ready when every Depends on issue is closed.
# See scripts/deps_bot.py and issue #6.
name: deps

on:
  issues:
    types: [closed, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deps-bot
  cancel-in-progress: false

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deps bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/deps_bot.py
