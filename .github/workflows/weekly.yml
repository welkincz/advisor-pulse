name: Weekly report

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      force_fail:
        description: Force the checks stage to fail for an alert drill
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install project dependencies
        run: |
          uv sync --frozen
          uv run dbt deps --project-dir dbt --profiles-dir dbt
          pnpm -C web install --frozen-lockfile

      - name: Record runner profile
        run: uv run python scripts/runner_profile.py --out data/artifacts/runner_profile.json

      - name: Check Claude subscription token
        id: narrative
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code CLI
        if: steps.narrative.outputs.available == 'true'
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code

      - name: Run last complete week
        id: weekly_run
        env:
          PULSE_FORCE_FAIL: ${{ inputs.force_fail && 'checks' || '' }}
          PULSE_DATA_DIR: data
          PULSE_NARRATIVE_BACKEND: claude-code
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: uv run pulse run --week last --run-type WEEKLY

      # Optional: a failed render warns and the site ships without the recap video.
      - name: Render weekly recap video
        if: steps.weekly_run.outcome == 'success'
        run: |
          if ! (pnpm -C video install --frozen-lockfile && make video); then
            echo "::warning::The recap video did not render; the site ships without it."
            echo "Recap video: not rendered this week (the site ships without it)." >> "$GITHUB_STEP_SUMMARY"
            rm -rf web/public/recap
          fi

      # Optional: the dbt docs read the warehouse this run just built (fixtures when there is
      # none). A failed build warns and the site ships without /lineage/.
      - name: Build dbt docs lineage
        if: steps.weekly_run.outcome == 'success'
        env:
          PULSE_DATA_DIR: data
        run: |
          if ! make dbt-docs-static; then
            echo "::warning::The dbt docs did not build; the site ships without /lineage/."
            echo "dbt docs: not built this run (the site ships without /lineage/)." >> "$GITHUB_STEP_SUMMARY"
            rm -rf web/public/lineage
          fi

      - name: Build weekly site
        id: build_site
        run: pnpm -C web build

      - name: Deploy to Cloudflare Pages
        if: always()
        uses: ./.github/actions/pages-deploy
        with:
          run-outcome: ${{ steps.weekly_run.outcome }}
          build-outcome: ${{ steps.build_site.outcome }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ github.token }}

      - name: Summarize run and collect check results
        if: always()
        env:
          PULSE_DATA_DIR: data
        run: python scripts/workflow_summary.py weekly

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: |
            data/exports/run_log.json
            data/artifacts/check_results.json
            data/artifacts/runner_profile.json
            data/dbt-target/run_results.json
            web/dist/
          if-no-files-found: warn
          retention-days: 14

      - name: Sync pipeline alert issue
        if: always()
        env:
          PULSE_DATA_DIR: data
          PULSE_JOB_STATUS: ${{ job.status }}
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python src/pulse/runner/alert.py
