name: Backfill weekly reports

on:
  workflow_dispatch:
    inputs:
      from:
        description: First ISO week, inclusive (YYYY-Www)
        required: true
        type: string
      to:
        description: Last ISO week, inclusive (YYYY-Www)
        required: true
        type: string
      rebuild:
        description: Start from an empty local warehouse and sources
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install project dependencies
        run: |
          uv sync --frozen
          uv run dbt deps --project-dir dbt --profiles-dir dbt
          pnpm -C web install --frozen-lockfile

      - name: Check Claude subscription token
        id: narrative
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code CLI
        if: steps.narrative.outputs.available == 'true'
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code

      - name: Backfill selected weeks
        id: backfill_run
        env:
          FROM_WEEK: ${{ inputs.from }}
          TO_WEEK: ${{ inputs.to }}
          REBUILD: ${{ inputs.rebuild }}
          PULSE_DATA_DIR: data
          PULSE_NARRATIVE_BACKEND: claude-code
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          args=(--from "$FROM_WEEK" --to "$TO_WEEK")
          if [[ "$REBUILD" == "true" ]]; then args+=(--rebuild); fi
          uv run pulse backfill "${args[@]}"

      - name: Build backfilled site
        id: build_site
        run: pnpm -C web build

      - name: Deploy to Cloudflare Pages
        if: always()
        uses: ./.github/actions/pages-deploy
        with:
          run-outcome: ${{ steps.backfill_run.outcome }}
          build-outcome: ${{ steps.build_site.outcome }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ github.token }}

      - name: Summarize runs and collect check results
        if: always()
        env:
          PULSE_DATA_DIR: data
          FROM_WEEK: ${{ inputs.from }}
          TO_WEEK: ${{ inputs.to }}
        run: python scripts/workflow_summary.py backfill

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-${{ github.run_id }}
          path: |
            data/exports/run_log.json
            data/artifacts/check_results.json
            data/dbt-target/run_results.json
            web/dist/
          if-no-files-found: warn
          retention-days: 14
