name: Backfill weekly reports

on:
  workflow_dispatch:
    inputs:
      from:
        description: First ISO week, inclusive (YYYY-Www)
        required: true
        type: string
      to:
        description: Last ISO week, inclusive (YYYY-Www)
        required: true
        type: string
      rebuild:
        description: Start from an empty local warehouse and sources
        required: true
        default: false
        type: boolean
      benchmark_only:
        description: Measure a local-only rebuild without remote state or deployment
        required: false
        default: false
        type: boolean
      budget_minutes:
        description: Stop cleanly between weeks after this many minutes and continue in a new run
        required: false
        default: '320'
        type: string

permissions:
  contents: read
  actions: write  # a run that hits its time budget dispatches the next one

concurrency:
  group: ${{ inputs.benchmark_only && format('backfill-benchmark-{0}', github.ref) || 'weekly' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install project dependencies
        run: |
          uv sync --frozen
          uv run dbt deps --project-dir dbt --profiles-dir dbt
          pnpm -C web install --frozen-lockfile

      - name: Check Claude subscription token
        id: narrative
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.benchmark_only != true && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          if [[ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code CLI
        if: steps.narrative.outputs.available == 'true'
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code

      - name: Backfill selected weeks
        id: backfill_run
        env:
          FROM_WEEK: ${{ inputs.from }}
          TO_WEEK: ${{ inputs.to }}
          REBUILD: ${{ inputs.rebuild }}
          BENCHMARK_ONLY: ${{ inputs.benchmark_only }}
          BUDGET_MINUTES: ${{ inputs.budget_minutes || '320' }}
          PULSE_DATA_DIR: data
          PULSE_NARRATIVE_BACKEND: claude-code
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.benchmark_only != true && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          R2_ACCESS_KEY_ID: ${{ inputs.benchmark_only != true && secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ inputs.benchmark_only != true && secrets.R2_SECRET_ACCESS_KEY || '' }}
          R2_BUCKET: ${{ inputs.benchmark_only != true && secrets.R2_BUCKET || '' }}
          R2_ENDPOINT_URL: ${{ inputs.benchmark_only != true && secrets.R2_ENDPOINT_URL || '' }}
        run: |
          args=(--from "$FROM_WEEK" --to "$TO_WEEK" --budget-minutes "$BUDGET_MINUTES")
          args+=(--resume-file "$RUNNER_TEMP/resume_week")
          if [[ "$REBUILD" == "true" ]]; then args+=(--rebuild); fi
          started=$SECONDS
          uv run pulse backfill "${args[@]}"
          echo "Backfill $FROM_WEEK..$TO_WEEK: $((SECONDS - started)) seconds (benchmark-only=$BENCHMARK_ONLY)." >> "$GITHUB_STEP_SUMMARY"
          if [[ -s "$RUNNER_TEMP/resume_week" ]]; then
            echo "next=$(cat "$RUNNER_TEMP/resume_week")" >> "$GITHUB_OUTPUT"
          fi

      # Optional, as in weekly.yml: the recap video of the last week backfilled. A failed render
      # warns and the site ships without it.
      - name: Render weekly recap video
        if: inputs.benchmark_only != true && steps.backfill_run.outcome == 'success' && steps.backfill_run.outputs.next == ''
        run: |
          if ! (pnpm -C video install --frozen-lockfile && make video); then
            echo "::warning::The recap video did not render; the site ships without it."
            echo "Recap video: not rendered this run (the site ships without it)." >> "$GITHUB_STEP_SUMMARY"
            rm -rf web/public/recap
          fi

      # Optional: the dbt docs read the warehouse this run just built (fixtures when there is
      # none). A failed build warns and the site ships without /lineage/.
      - name: Build dbt docs lineage
        if: inputs.benchmark_only != true && steps.backfill_run.outcome == 'success' && steps.backfill_run.outputs.next == ''
        env:
          PULSE_DATA_DIR: data
        run: |
          if ! make dbt-docs-static; then
            echo "::warning::The dbt docs did not build; the site ships without /lineage/."
            echo "dbt docs: not built this run (the site ships without /lineage/)." >> "$GITHUB_STEP_SUMMARY"
            rm -rf web/public/lineage
          fi

      # A run that stopped on its budget leaves the site alone: the last run of the chain deploys,
      # so the public site never shows a half-rebuilt history.
      - name: Build backfilled site
        id: build_site
        if: inputs.benchmark_only != true && steps.backfill_run.outputs.next == ''
        run: pnpm -C web build

      - name: Continue in a new run
        if: inputs.benchmark_only != true && steps.backfill_run.outcome == 'success' && steps.backfill_run.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_WEEK: ${{ steps.backfill_run.outputs.next }}
          TO_WEEK: ${{ inputs.to }}
          BUDGET_MINUTES: ${{ inputs.budget_minutes || '320' }}
        run: |
          gh workflow run backfill.yml --ref "$GITHUB_REF_NAME" \
            -f from="$NEXT_WEEK" -f to="$TO_WEEK" -f rebuild=false -f budget_minutes="$BUDGET_MINUTES"
          echo "Stopped on the time budget; continuing from $NEXT_WEEK in a new run." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloudflare Pages
        if: always() && inputs.benchmark_only != true && steps.backfill_run.outputs.next == ''
        uses: ./.github/actions/pages-deploy
        with:
          run-outcome: ${{ steps.backfill_run.outcome }}
          build-outcome: ${{ steps.build_site.outcome }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ github.token }}

      - name: Summarize runs and collect check results
        if: always()
        env:
          PULSE_DATA_DIR: data
          FROM_WEEK: ${{ inputs.from }}
          TO_WEEK: ${{ inputs.to }}
        run: python scripts/workflow_summary.py backfill

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-${{ github.run_id }}
          path: |
            data/exports/run_log.json
            data/artifacts/check_results.json
            data/dbt-target/run_results.json
            web/dist/
          if-no-files-found: warn
          retention-days: 14
