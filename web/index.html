<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advisor Pulse: weekly advisor activity for Maplecrest Bank (fictional)</title>
    <meta name="description" content="A weekly batch report on advisor activity for a fictional bank, built end to end from synthetic data: dbt, DuckDB, a Python runner and a React site." />
    <meta name="theme-color" content="#F6F7F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181D" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply a stored colour scheme before first paint, so a dark choice never flashes light.
      try { var t = localStorage.getItem('pulse-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
