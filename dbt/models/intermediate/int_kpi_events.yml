version: 2

models:
  - name: int_kpi_events
    description: >
      KPI building blocks (PLAN.md §7): one row per event with the ISO week it counts in,
      the credited branch and its additive parts, so the weekly marts rebuild every ratio
      from summed parts. Event kinds: `completed` (by activity date), `scheduled`
      (appointments and reviews, by SCHEDULED_TS), `booked` (by CREATED_TS), `advisor`
      (one advisor with a non-manager employment range overlapping the week) and `portfolio` (an active
      client in a known portfolio at week end, credited to the holder and the transit branch).
    data_tests:
      - expression_is_true:
          arguments:
            expression: "portfolio_contacted_12m <= portfolio_clients"
      - expression_is_true:
          arguments:
            expression: "(event_kind in ('advisor', 'portfolio')) <= (advisor_id is not null)"
    columns:
      - name: iso_week_id
        description: ISO week the event counts in.
        data_type: varchar
        data_tests: [not_null, iso_week_id_format]
      - name: advisor_id
        description: The advisor; null for activity whose advisor has no history on that date (DQ012).
        data_type: varchar
      - name: branch_id
        description: Credited branch (activity events), the first non-manager branch overlapping the week (advisor events) or the transit branch (portfolio events).
        data_type: varchar
        data_tests: [not_null]
      - name: event_kind
        description: completed, scheduled, booked, advisor or portfolio.
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'scheduled', 'booked', 'advisor', 'portfolio']
      - name: activities_completed
        description: 1 for a completed activity.
      - name: calls_out
        description: 1 for a completed CALL_OUT.
      - name: calls_in
        description: 1 for a completed CALL_IN.
      - name: appointments_booked
        description: 1 for an appointment or review created this week.
      - name: booked_from_call
        description: 1 for a booked appointment with booked_from_activity_id set.
      - name: appointments_held
        description: 1 for an appointment or review scheduled this week and completed.
      - name: no_shows
        description: 1 for an appointment or review scheduled this week with status NO_SHOW.
      - name: conversions
        description: 1 for a held appointment with outcome PLAN_CREATED or PRODUCT_OPENED.
      - name: meeting_minutes
        description: duration_min of a completed appointment or review.
      - name: meetings_held
        description: 1 for a completed appointment or review (the AVG_MEET_MIN denominator).
      - name: contacted_client_id
        description: Client of a completed contact activity; counted distinct per grain.
      - name: active_advisors
        description: 1 for an advisor event.
      - name: portfolio_clients
        description: 1 for a portfolio event (an active client in a known portfolio at week end).
      - name: portfolio_contacted_12m
        description: 1 for a portfolio client contacted by any advisor in the trailing 12 months.
