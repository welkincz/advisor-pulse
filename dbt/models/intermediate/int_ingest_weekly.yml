version: 2

models:
  - name: int_ingest_weekly
    description: >
      One row per ISO week with a loaded activity or CLNT file: rows read, quarantined by
      rule (DQ001–DQ005, from quarantine.rejected_rows), and per-row counts over the
      loaded activity rows (late-arriving, collapsed by staging dedupe DQ010, unknown
      advisor DQ012). A file belongs to the week of the date in its name; the undated CLNT
      snapshot to the first activity week of the run that loaded it. Feeds mart_dq_weekly
      and the LATE_RATE and QUAR_RATE rows of mart_weekly_report.
    data_tests:
      - expression_is_true:
          arguments:
            expression: "activity_rows = activity_loaded + activity_quarantined"
      - expression_is_true:
          arguments:
            expression: "activity_quarantined = dq001_rows + dq002_rows + dq003_rows + dq004_rows"
      - expression_is_true:
          arguments:
            expression: "client_quarantined = dq005_rows and client_quarantined <= client_rows"
      - expression_is_true:
          arguments:
            expression: "greatest(late_rows, dedupe_rows, unknown_advisor_rows) <= activity_loaded"
    columns:
      - name: iso_week_id
        description: ISO week of the batch, YYYY-Www. The grain.
        data_tests: [not_null, unique, iso_week_id_format]
      - name: activity_rows
        description: Activity rows read from this week's extract files, quarantined rows included.
        data_tests: [not_null]
      - name: activity_loaded
        description: Activity rows loaded to raw (read minus quarantined); the LATE_RATE denominator.
        data_tests: [not_null]
      - name: activity_quarantined
        description: Activity rows quarantined at ingest (DQ001–DQ004).
        data_tests: [not_null]
      - name: dq001_rows
        description: Activity rows quarantined for a null ACTIVITY_ID.
        data_tests: [not_null]
      - name: dq002_rows
        description: Activity rows quarantined for an enum value not in the contract.
        data_tests: [not_null]
      - name: dq003_rows
        description: Activity rows quarantined for DURATION_MIN out of range.
        data_tests: [not_null]
      - name: dq004_rows
        description: Activity rows quarantined for ACTIVITY_TS out of range.
        data_tests: [not_null]
      - name: late_rows
        description: >
          Loaded activity rows whose activity week is before the batch week, counting only
          the first load of each ACTIVITY_ID: a re-sent copy of a row loaded earlier is a
          dedupe row (DQ010), not a late one. The LATE_RATE numerator.
        data_tests: [not_null]
      - name: dedupe_rows
        description: >
          Loaded activity rows whose activity_id was already loaded in an earlier or the
          same week: exact copies and re-sent versions that staging collapses (DQ010).
        data_tests: [not_null]
      - name: unknown_advisor_rows
        description: Loaded activity rows whose ADVISOR_ID is not in the advisor master (DQ012).
        data_tests: [not_null]
      - name: client_rows
        description: CLNT rows read this week (snapshot and daily deltas), quarantined rows included.
        data_tests: [not_null]
      - name: client_quarantined
        description: CLNT rows quarantined at ingest.
        data_tests: [not_null]
      - name: dq005_rows
        description: CLNT rows quarantined for an unparseable value.
        data_tests: [not_null]

unit_tests:
  - name: int_ingest_weekly_counts_a_stale_resend_as_dedupe_not_late
    description: >
      A-1 loads in W38. In W40 a stale BOOKED copy of A-1 arrives with its W38 booking
      time: it is a dedupe row, not a late one. A-2 first arrives in W39 with a W38
      timestamp, so it is late.
    model: int_ingest_weekly
    given:
      - input: source('meta', 'load_manifest')
        rows:
          - {file_path: 'snowflake/activity/extract_date=2026-09-14/part-0.parquet', batch_id: b38, run_id: r1, table_name: activity, row_count: 1, status: LOADED}
          - {file_path: 'snowflake/activity/extract_date=2026-09-21/part-0.parquet', batch_id: b39, run_id: r1, table_name: activity, row_count: 1, status: LOADED}
          - {file_path: 'snowflake/activity/extract_date=2026-09-28/part-0.parquet', batch_id: b40, run_id: r1, table_name: activity, row_count: 1, status: LOADED}
      - input: source('quarantine', 'rejected_rows')
        rows: []
      - input: source('raw', 'snowflake__activity')
        rows:
          - {ACTIVITY_ID: A-1, ADVISOR_ID: ADV-1, ACTIVITY_TS: '2026-09-15 14:00:00+00', _batch_id: b38, _source_file: f38, _source_row: 1}
          - {ACTIVITY_ID: A-2, ADVISOR_ID: ADV-1, ACTIVITY_TS: '2026-09-16 14:00:00+00', _batch_id: b39, _source_file: f39, _source_row: 1}
          - {ACTIVITY_ID: A-1, ADVISOR_ID: ADV-1, ACTIVITY_TS: '2026-09-15 14:00:00+00', _batch_id: b40, _source_file: f40, _source_row: 1}
      - input: ref('stg_advisor')
        rows:
          - {advisor_id: ADV-1}
      - input: ref('int_contact_window')
        rows:
          - {iso_week_id: '2026-W38', is_reported: true}
          - {iso_week_id: '2026-W39', is_reported: true}
          - {iso_week_id: '2026-W40', is_reported: true}
    expect:
      rows:
        - {iso_week_id: '2026-W38', activity_loaded: 1, late_rows: 0, dedupe_rows: 0}
        - {iso_week_id: '2026-W39', activity_loaded: 1, late_rows: 1, dedupe_rows: 0}
        - {iso_week_id: '2026-W40', activity_loaded: 1, late_rows: 0, dedupe_rows: 1}

  - name: int_ingest_weekly_leaves_the_warm_up_extracts_out
    description: >
      The first run loads a warm-up extract (W39, before the report starts) with the first
      reported week's extract (W40) and the CLNT snapshot. The warm-up week is not an
      ingest week, and the snapshot counts in W40, the run's first reported week.
    model: int_ingest_weekly
    given:
      - input: source('meta', 'load_manifest')
        rows:
          - {file_path: 'snowflake/activity/extract_date=2026-09-27/part-0.parquet', batch_id: b39, run_id: r1, table_name: activity, row_count: 5, status: LOADED}
          - {file_path: 'snowflake/activity/extract_date=2026-10-04/part-0.parquet', batch_id: b40, run_id: r1, table_name: activity, row_count: 3, status: LOADED}
          - {file_path: 'teradata/edw.sqlite', batch_id: bc, run_id: r1, table_name: CLNT, row_count: 7, status: LOADED}
      - input: source('quarantine', 'rejected_rows')
        rows: []
      - input: source('raw', 'snowflake__activity')
        rows: []
      - input: ref('stg_advisor')
        rows: []
      - input: ref('int_contact_window')
        rows:
          - {iso_week_id: '2026-W39', is_reported: false}
          - {iso_week_id: '2026-W40', is_reported: true}
    expect:
      rows:
        - {iso_week_id: '2026-W40', activity_rows: 3, client_rows: 7}
