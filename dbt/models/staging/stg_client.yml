version: 2

models:
  - name: stg_client
    description: >
      One row per client, the latest update across the CLNT snapshot and daily deltas.
      `postal_code` is normalized to `A1A 1A1`. Invalid and missing postal codes have a
      null `postal_code`, `postal_valid_flag` false, and `fsa_code` `UNK`.
    data_tests:
      - expression_is_true:
          arguments:
            expression: >
              (postal_valid_flag and postal_code is not null and fsa_code = substr(postal_code, 1, 3))
              or (not postal_valid_flag and postal_code is null and fsa_code = 'UNK')
      - expression_is_true:
          arguments:
            expression: >
              postal_code is null
              or regexp_full_match(postal_code, '^[ABCEGHJ-NPRSTVXY][0-9][ABCEGHJ-NPRSTV-Z] [0-9][ABCEGHJ-NPRSTV-Z][0-9]$')
      - expression_is_true:
          arguments:
            expression: "birth_year between 1920 and 2010"
      - expression_is_true:
          arguments:
            expression: "regexp_full_match(client_id, '^CLI-[0-9]{8}$')"
      - expression_is_true:
          arguments:
            expression: "regexp_full_match(fsa_code, '^([ABCEGHJ-NPRSTVXY][0-9][ABCEGHJ-NPRSTV-Z]|UNK)$')"
    columns:
      - name: client_id
        description: Natural key, `CLI-` plus 8 digits.
        data_type: varchar
        data_tests: [unique, not_null]
      - name: client_since_date
        description: Date the relationship started.
        data_type: date
        data_tests: [not_null]
      - name: birth_year
        description: Birth year. The source does not carry a full date of birth.
        data_type: integer
        data_tests: [not_null]
      - name: segment_code
        description: "`MASS`, `MAFF` (mass affluent), `AFFL`, or `SMBS` (small business)."
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["MASS", "MAFF", "AFFL", "SMBS"]
      - name: postal_code
        description: Postal code normalized to `A1A 1A1`. Null when the raw value is missing or invalid.
        data_type: varchar
      - name: fsa_code
        description: First three characters of the normalized postal code, or `UNK` when it is not valid.
        data_type: varchar
        data_tests: [not_null]
      - name: postal_valid_flag
        description: True when `postal_code` matched the Canadian postal pattern after normalization.
        data_type: boolean
        data_tests: [not_null]
      - name: province_code
        description: Province code from the source (`ON`, `QC`, `BC`, `AB`, `SK`, `MB`, `NS`, `PE`, `NB`, `NL`).
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ON", "QC", "BC", "AB", "SK", "MB", "NS", "PE", "NB", "NL"]
      - name: primary_branch_id
        description: Home branch on this version of the row.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_branch')
                field: branch_id
      - name: status_code
        description: "`A` active or `C` closed."
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["A", "C"]
      - name: last_updated_ts
        description: Source watermark of the surviving version (UTC).
        data_type: timestamp with time zone
        data_tests: [not_null]
      - name: _batch_id
        description: Load batch of the surviving row (`run_id`, source, and file hash prefix).
        data_type: varchar
        data_tests: [not_null]
