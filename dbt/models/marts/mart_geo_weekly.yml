version: 2

models:
  - name: mart_geo_weekly
    description: >
      One row per FSA, district and ISO week (PLAN.md §6.8), exported as geo_weekly.parquet
      for the map; the export keeps the last 13 weeks. Clients are the active book at week
      end (int_client_book_weekly), placed by the FSA on that week's client version (`UNK`
      when the postal code does not normalize, DQ011) and the district of their home
      branch. An FSA that straddles two districts has one row per district.
    data_tests:
      - expression_is_true:
          arguments:
            expression: "portfolio_contacted_12m <= portfolio_clients"
      - expression_is_true:
          arguments:
            expression: "regexp_full_match(fsa_code, '^([ABCEGHJ-NPRSTVXY][0-9][ABCEGHJ-NPRSTV-Z]|UNK)$')"
    columns:
      - name: iso_week_id
        description: ISO week, YYYY-Www. Weeks are those of mart_org_weekly.
        data_type: varchar
        data_tests: [not_null, iso_week_id_format]
      - name: fsa_code
        description: Forward sortation area (first three postal characters), or UNK.
        data_type: varchar
        data_tests: [not_null]
      - name: district_code
        description: District of the clients' home branch.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_org')
                field: district_code
      - name: active_clients
        description: Active clients at week end in this FSA and district, in any portfolio (DQ014 included).
        data_type: bigint
        data_tests: [not_null]
      - name: activities_completed
        description: Completed activities this week for these clients, by any advisor.
        data_type: bigint
        data_tests: [not_null]
      - name: portfolio_clients
        description: "Active portfolio clients at week end, by transit; for the quarter, taken at each branch's own last reported week (a stock). The PRTF_CONTACT_12M denominator."
        data_type: bigint
        data_tests: [not_null]
      - name: portfolio_contacted_12m
        description: "Of those, clients contacted by any advisor in the trailing 12 months. The PRTF_CONTACT_12M numerator."
        data_type: bigint
        data_tests: [not_null]
      - name: portfolio_contacted_rate_12m
        description: "PRTF_CONTACT_12M = portfolio_contacted_12m ÷ portfolio_clients, 4 decimals; null before a full 12-month window."
        data_type: double
