version: 2

seeds:
  - name: org_branch
    description: >
      One row per branch in reference/org.yaml. Generated by `make seeds`. Do not edit.
    config:
      column_types:
        branch_id: varchar
        branch_name: varchar
        district_code: varchar
        district_name: varchar
        region_code: varchar
        region_name: varchar
        fsa_code: varchar
        province_code: varchar
        open_date: date
    columns:
      - name: branch_id
        description: Branch natural key.
        data_tests: [unique, not_null]
      - name: branch_name
        description: Branch name.
        data_tests: [not_null]
      - name: district_code
        description: District code.
        data_tests: [not_null]
      - name: district_name
        description: District name.
        data_tests: [not_null]
      - name: region_code
        description: Region code, one per province with branches (`ON`, `QC`, `BC`, `AB`, `SK`, `MB`, `NS`, `PE`, `NB`, `NL`).
        data_tests: [not_null]
      - name: region_name
        description: Region name.
        data_tests: [not_null]
      - name: fsa_code
        description: Branch forward sortation area.
        data_tests: [not_null]
      - name: province_code
        description: Province of the branch FSA.
        data_tests: [not_null]
      - name: open_date
        description: Date the branch opened.
        data_tests: [not_null]
  - name: fsa_province
    description: >
      Canada Post first-letter to province map, generated by `make seeds`. Do not edit.
    config:
      column_types:
        fsa_first_letter: varchar
        province_code: varchar
        province_name: varchar
    columns:
      - name: fsa_first_letter
        description: First character of an FSA.
        data_tests: [unique, not_null]
      - name: province_code
        description: Province code for that letter.
        data_tests: [not_null]
      - name: province_name
        description: Province name for that letter.
        data_tests: [not_null]
  - name: fsa_boundary
    description: >
      FSA codes in the shipped StatCan layer (`web/public/geo/fsa.topo.json`).
      Generated by `make seeds`. Do not edit.
    config:
      column_types:
        fsa_code: varchar
    columns:
      - name: fsa_code
        description: Forward sortation area that has a shipped boundary.
        data_tests: [unique, not_null]
  - name: business_week
    description: >
      The business calendar's expected weekly volume, one row per ISO week in `dim_date`'s
      default range: `pulse.business_calendar.week_factor`, the same factors the generator
      scales activity by and DQ031 divides by. Generated by `make seeds`. Do not edit.
    data_tests:
      - expression_is_true:
          arguments:
            expression: "week_factor > 0"
    config:
      column_types:
        iso_week_id: varchar
        week_factor: double
    columns:
      - name: iso_week_id
        description: ISO week label, e.g. `2026-W36`.
        data_tests: [unique, not_null, iso_week_id_format]
      - name: week_factor
        description: >
          Expected volume relative to an ordinary week: 1.0 with no holiday or February
          lift, below 1 in a statutory-holiday week, above 1 in February.
        data_tests: [not_null]
