# Isolated lab project (#324): not part of the root advisor-pulse package or its lock.
[project]
name = "legacy-migration-lab"
version = "0.1.0"
description = "Synthetic legacy-to-dbt parity exercise for Advisor Pulse. Local, single machine."
requires-python = ">=3.12,<3.13"
dependencies = ["duckdb>=1.1"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
